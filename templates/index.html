<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Lab Task Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Task Tracker v2</h1>

    <form action="{{ url_for('add_task') }}" method="post" class="add-form">
      <label for="title" class="sr-only">New task</label>
      <input id="title" name="title" type="text" maxlength="120" placeholder="Enter a new task..." required autofocus>
      <button type="submit">Add task</button>
    </form>

    {% if tasks %}
      <ul class="tasks">
        {% for task in tasks %}
          <li>
            <span>{{ task.title }}</span>
            <form action="{{ url_for('delete_task', task_id=task.id) }}" method="post">
              <button class="delete" type="submit" aria-label="Delete {{ task.title }}">Delete</button>
            </form>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="empty">No tasks yet. Add one above to get started.</p>
    {% endif %}
    </main>
</body>
</html>
